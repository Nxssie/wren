name: Gradle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew :desktop:build :desktop:test

  distro:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            format: Deb
            name: linux
          - os: windows-latest
            format: Msi
            name: windows
          - os: macos-latest
            format: Dmg
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Build ${{ matrix.name }} distributable
        run: ./gradlew :desktop:package${{ matrix.format }}
      - name: Dump jpackage logs on failure
        if: failure()
        shell: bash
        run: cat desktop/build/compose/logs/*/*.txt 2>/dev/null || true
      - name: Rename artifact
        shell: bash
        run: |
          dir="desktop/build/compose/binaries/main/$(echo "${{ matrix.format }}" | tr '[:upper:]' '[:lower:]')"
          cd "$dir"
          case "${{ matrix.format }}" in
            Deb) echo "ARTIFACT_GLOB=$dir/wren_*" >> "$GITHUB_ENV" ;; # already correct Debian convention
            Msi) for f in wren-*.msi; do mv "$f" "Wren-${f#wren-}"; done; echo "ARTIFACT_GLOB=$dir/Wren-*" >> "$GITHUB_ENV" ;;
            Dmg)
              # dmgPackageVersion is a jpackage-internal placeholder (see desktop/build.gradle.kts);
              # rename to the real release version (desktop/build.gradle.kts' appVersion).
              app_version=$(sed -n 's/.*val appVersion = "\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/desktop/build.gradle.kts")
              mv wren-*.dmg "Wren-${app_version}.dmg"
              echo "ARTIFACT_GLOB=$dir/Wren-*" >> "$GITHUB_ENV"
              ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: wren-${{ matrix.name }}
          path: ${{ env.ARTIFACT_GLOB }}
          if-no-files-found: ignore
