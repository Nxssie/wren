name: Gradle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew :desktop:build :desktop:test

  distro:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            format: Deb
            name: linux
          - os: windows-latest
            format: Msi
            name: windows
          - os: macos-latest
            format: Dmg
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Build ${{ matrix.name }} distributable
        run: ./gradlew :desktop:package${{ matrix.format }}
      - name: Rename artifact
        shell: bash
        run: |
          dir="desktop/build/compose/binaries/main/$(echo "${{ matrix.format }}" | tr '[:upper:]' '[:lower:]')"
          cd "$dir"
          case "${{ matrix.format }}" in
            Deb) ;; # wren_*.deb is already correct Debian convention
            Msi) mv wren-*.msi Wren-*.msi ;;
            Dmg) mv wren-*.dmg Wren-*.dmg ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: wren-${{ matrix.name }}
          path: |
            desktop/build/compose/binaries/main/deb/wren_*
            desktop/build/compose/binaries/main/msi/Wren-*
            desktop/build/compose/binaries/main/dmg/Wren-*
          if-no-files-found: ignore
